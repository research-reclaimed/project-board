<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  /* Sized for a 1080p TV seen from across a room. 1vw = 1% of screen width. */
  :root {
    --bg: #12161c; --card: #1e252e; --ink: #f2f4f7; --muted: #9aa6b2;
    --accent: #56b4e9;  /* sky blue (colorblind-safe) */
    --soon: #e69f00;    /* orange: due within 14 days */
    --late: #d55e00;    /* vermillion: due today or overdue (always labeled in words too) */
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.2vw 1.6vw; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 0.95vw; line-height: 1.3; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.8vw; }
  h1 { font-size: 1.8vw; margin: 0; font-weight: 700; }
  #clock { font-size: 1.8vw; font-weight: 600; }
  #updated { color: var(--muted); font-size: 0.75vw; }
  .strip-title { text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-size: 0.75vw; margin: 0 0 0.4vw; }
  #focus { display: flex; gap: 0.8vw; margin-bottom: 1vw; }
  #focus .card { flex: 1; border-left: 0.35vw solid var(--accent); font-size: 1.15vw; }
  #groups { column-count: 4; column-gap: 1vw; }
  .group { break-inside: avoid; margin-bottom: 1vw; }
  .group h2 { font-size: 1.05vw; margin: 0 0 0.4vw; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  .card { background: var(--card); border-radius: 0.4vw; padding: 0.55vw 0.7vw; margin-bottom: 0.45vw; break-inside: avoid; }
  .name { font-weight: 700; }
  .status { color: var(--muted); margin-top: 0.15vw; }
  .doing { display: inline-block; border: 1px solid var(--muted); border-radius: 1vw; padding: 0 0.45vw; margin-left: 0.3vw; color: var(--ink); }
  .next { margin-top: 0.25vw; }
  .next::before { content: "→ "; color: var(--accent); }
  .due { display: inline-block; margin-top: 0.25vw; font-weight: 600; color: var(--muted); }
  .due.soon { color: var(--soon); }
  .due.late { color: var(--bg); background: var(--late); padding: 0 0.4vw; border-radius: 0.3vw; }
  #waiting { margin-top: 0.6vw; padding-top: 0.6vw; border-top: 1px solid #2c3540; color: var(--muted); }
  #waiting span { color: var(--ink); }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <header>
    <div><h1>Project Board</h1><div id="updated">Loading…</div></div>
    <div id="clock"></div>
  </header>

  <div class="strip-title">Today's focus</div>
  <div id="focus"></div>

  <div id="groups"></div>

  <div id="waiting"></div>

<script>
  // visitor is set on the server from ?visitor=1 in the web address.
  // Google replaces the tag below with yes or no (from ?visitor=1 in the web address).
  // Opened as a plain file, the tag stays as literal text, which counts as "no".
  const VISITOR = "<?!= visitor ? 'yes' : 'no' ?>" === 'yes';

  // The groups shown on the board, in this order. The names must match the "group" column
  // in your Sheet exactly. Add, remove or rename groups here.
  const GROUP_ORDER = ['Manuscript', 'Student', 'Grant', 'Consulting', 'Teaching', 'Admin', 'Service'];
  const GROUP_LABEL = { Manuscript: 'Manuscripts', Student: 'Students', Grant: 'Grants',
                        Consulting: 'Consulting', Teaching: 'Teaching', Admin: 'Admin', Service: 'Service' };

  // Example rows, used only when this file is opened directly in a browser (demo mode),
  // so you can see what the board looks like before setting anything up.
  const DEMO_ROWS = [
    { group: 'Manuscript', board_name: 'Seagrass light paper', where_it_is: 'Draft', doing_now: 'Writing', ball_in_court: 'yes', focus_today: 'yes', next_task_1to2hr: 'Write Methods section 2.3', due: '', sort: '10' },
    { group: 'Manuscript', board_name: 'Coauthor review paper', where_it_is: 'Co-author review', doing_now: '', ball_in_court: 'no', focus_today: '', next_task_1to2hr: '', due: '', sort: '20' },
    { group: 'Student', board_name: 'AB - Fish and offshore wind', where_it_is: 'Ch. 1 of 1', doing_now: 'Analysis', ball_in_court: 'yes', focus_today: '', next_task_1to2hr: 'Read Ch. 1 Results draft', due: '', sort: '10' },
    { group: 'Student', board_name: 'CD - Shark diets', where_it_is: 'Ch. 2 of 3', doing_now: 'Writing', ball_in_court: 'no', focus_today: '', next_task_1to2hr: '', due: '', sort: '20' },
    { group: 'Grant', board_name: 'Coastal resilience award', where_it_is: 'Active', doing_now: 'Field planning', ball_in_court: 'yes', focus_today: 'yes', next_task_1to2hr: 'Book field boats for June', due: 'in 9 days', sort: '10' },
    { group: 'Grant', board_name: 'New proposal', where_it_is: 'Proposal', doing_now: 'Writing', ball_in_court: 'yes', focus_today: '', next_task_1to2hr: 'Draft budget justification', due: 'in 40 days', sort: '20' },
    { group: 'Teaching', board_name: 'BIO 210 Ecology', where_it_is: 'Week 12 of 14', doing_now: 'Lecture prep', ball_in_court: 'yes', focus_today: 'yes', next_task_1to2hr: 'Finish Thursday slides', due: 'in 0 days', sort: '10' },
    { group: 'Consulting', board_name: 'Client modeling project', where_it_is: 'Active', doing_now: 'Model building', ball_in_court: 'yes', focus_today: '', next_task_1to2hr: 'Send monthly invoice', due: 'in -2 days', sort: '10' },
    { group: 'Admin', board_name: 'Email', where_it_is: 'Daily', doing_now: '', ball_in_court: 'yes', focus_today: '', next_task_1to2hr: 'Inbox triage (30 min at 3:30 pm)', due: '', sort: '10' }
  ];

  // Demo rows say "in N days"; turn that into a real date relative to today.
  function demoDate(s) {
    const m = /^in (-?\d+) days$/.exec(s || '');
    if (!m) return s;
    const d = new Date(); d.setDate(d.getDate() + Number(m[1]));
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Make text safe to put on the page.
  function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // Turn a due date (yyyy-mm-dd) into a short label like "Due Dec 14 (21 days)".
  function dueLabel(due) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(due || '');
    if (!m) return '';
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Math.round((d - today) / 86400000);
    const when = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    if (days < 0)  return '<span class="due late">Overdue: ' + when + '</span>';
    if (days === 0) return '<span class="due late">Due today</span>';
    const cls = days <= 14 ? 'due soon' : 'due';
    return '<span class="' + cls + '">Due ' + when + ' (' + days + (days === 1 ? ' day' : ' days') + ')</span>';
  }

  function card(r) {
    let h = '<div class="card"><div class="name">' + esc(r.board_name) + '</div>';
    h += '<div class="status">' + esc(r.where_it_is);
    if (r.doing_now && r.doing_now !== '?') h += '<span class="doing">' + esc(r.doing_now) + '</span>';
    h += '</div>';
    if (r.next_task_1to2hr && r.next_task_1to2hr !== 'TODO') h += '<div class="next">' + esc(r.next_task_1to2hr) + '</div>';
    h += dueLabel(r.due);
    return h + '</div>';
  }

  function render(data) {
    const rows = data.rows.slice().sort((a, b) =>
      (GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group)) || (Number(a.sort) - Number(b.sort)));
    const waiting = rows.filter(r => r.ball_in_court.toLowerCase() === 'no');
    const mine = rows.filter(r => r.ball_in_court.toLowerCase() !== 'no');
    const focus = mine.filter(r => r.focus_today.toLowerCase() === 'yes');

    document.getElementById('focus').innerHTML = focus.length
      ? focus.map(card).join('')
      : '<div class="empty">Nothing marked. Type "yes" in the focus_today column for up to 3 rows.</div>';

    let html = '';
    GROUP_ORDER.forEach(g => {
      const inGroup = mine.filter(r => r.group === g && r.focus_today.toLowerCase() !== 'yes');
      if (inGroup.length) html += '<div class="group"><h2>' + GROUP_LABEL[g] + '</h2>' + inGroup.map(card).join('') + '</div>';
    });
    document.getElementById('groups').innerHTML = html;

    document.getElementById('waiting').innerHTML = waiting.length
      ? 'Waiting on others: <span>' + waiting.map(r => esc(r.board_name)).join(' · ') + '</span>' : '';
    document.getElementById('updated').textContent =
      (VISITOR ? 'Visitor view · ' : '') + 'Updated ' + data.updated;
  }

  function load() {
    // Opened directly in a browser (not from Google): show the demo rows instead.
    if (typeof google === 'undefined') {
      render({ rows: DEMO_ROWS.map(r => Object.assign({}, r, { due: demoDate(r.due) })),
               updated: 'just now · DEMO: example rows, not your Sheet' });
      return;
    }
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(err => { document.getElementById('updated').textContent = 'Could not load the sheet: ' + err.message; })
      .getBoardData(VISITOR);
  }

  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  tick(); setInterval(tick, 15000);        // clock: every 15 seconds
  load(); setInterval(load, 5 * 60000);    // rows: every 5 minutes
</script>
</body>
</html>
